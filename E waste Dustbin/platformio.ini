; E-Waste Dustbin - PlatformIO config

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
upload_speed = 921600
lib_deps =
    olikraus/U8g2@^2.35
    bogde/HX711@^0.7.5
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
